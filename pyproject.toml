[project]
name = "amp-memory"
version = "0.3.0"
description = "AMP: The Agent Memory Protocol - A local-first, MCP-native memory server."
authors = [
    {name = "Akshay Kumar", email = "akumar8@mt.iitr.ac.in"},
]
dependencies = [
    "mcp>=1.0.0",
    "sqlite-utils>=3.36",
    "pydantic>=2.0",
    "typer>=0.9.0", # For CLI
    "numpy>=1.24.0", # For vector ops
    "requests>=2.31", # For Ollama API
    "fastembed>=0.3", # For embeddings
    "fastapi>=0.100", # For Dashboard
    "uvicorn>=0.20", # For Dashboard server
    "jinja2>=3.0", # For templates
    "google-generativeai>=0.8.5",
    "mem0ai>=1.0.1",
    "ollama>=0.6.1",
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
amp = "amp.cli:main"

[tool.hatch.build]
# Research material and build output are not part of the installable package and
# must not be republished to PyPI. The paper, its data and any working drafts
# live in the git repository only.
exclude = [
    "/paper",
    "/benchmarks",
    "/docs",
    "/dist",
]

# The sdist is defined by an explicit allowlist rather than by exclusions alone:
# hatchling merges the exclude list above with the repository's .gitignore rules,
# and a `!` negation there (benchmarks/results/locomo_local/*.csv, which is
# deliberately tracked for the paper) would otherwise win and pull those files
# back into the distribution.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/examples",
    "/assets",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/amp"]
